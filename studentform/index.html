<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <div class="container">
    <h1>Student Registration Form</h1>

    <form id="form">
        <div class="container">
        <table border="2">
            <tr>
                <td>Enter your name:</td>
                <td><input type="text" id="name"></td>
            </tr>
            <tr>
                <td>Enter your age:</td>
                <td><input type="text" id="age"></td>
            </tr>
            <tr>
                <td>Enter your email:</td>
                <td><input type="text" id="email"></td> 
              </tr> 
            <tr>
                <td>Enter your phone number:</td>
                <td><input type="text" id="phone"></td>
            </tr>
            <tr>
                <td>Enter your address:</td>
                <td><input type="text" id="address"></td>
            </tr>
            <tr>
                <td>Enter your gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male    
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>
            <tr>
                <td>Enter your Branch-Section:</td>
                <td><input type="text" id="branch-section"></td>
            </tr>
            <tr>
                <td>Enter your Roll Number:</td>
                <td><input type="text" id="roll-number"></td>
            </tr>
            <tr>
                <td>Enter your Course:</td>
                <td><input type="text" id="course"></td>   
            </tr>
            <tr>
                <td>Enter your College Name:</td>
                <td><input type="text" id="college-name"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Submit"></td>
            </tr>
        </div>

        </table>

    </form>
    </center>
</body>
</html>
